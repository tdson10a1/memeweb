<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dogs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Menu -->
<nav>
  <a href="index.html">Home</a>
  <a href="memes.html">Memes</a>
  <a href="cats.html">Cats</a>
  <a href="dogs.html">Dogs</a>
</nav>

<main>
  <h2 class="page-title">🐶 Dog Memes</h2>

  <!-- Gallery -->
  <div class="home-memes" id="dog-gallery"></div>
</main>

<!-- ================= RANDOM DOG SCRIPT ================= -->
<script>
  const gallery = document.getElementById("dog-gallery");

  /* ===== CẤU HÌNH – CHỈ SỬA Ở ĐÂY ===== */
  const CONFIG = {
    totalShow: 38,   // 👉 số ảnh hiển thị
    folder: "dog",
    prefix: "d",
    count: 38        // 👉 tổng số dog bạn có
  };

  // Các định dạng ảnh hỗ trợ
  const extensions = ["gif", "jpg", "jpeg", "png", "webp"];

  /* ===== LOGIC – KHÔNG CẦN SỬA ===== */
  let images = [];

  for (let i = 1; i <= CONFIG.count; i++) {
    extensions.forEach(ext => {
      images.push(`${CONFIG.folder}/${CONFIG.prefix}${i}.${ext}`);
    });
  }

  // Random
  images.sort(() => Math.random() - 0.5);

  let loaded = 0;

  images.forEach(src => {
    if (loaded >= CONFIG.totalShow) return;

    const img = new Image();
    img.src = src;
    img.loading = "lazy";
    img.alt = "Funny dog meme";

    img.onload = () => {
      if (loaded < CONFIG.totalShow) {
        gallery.appendChild(img);
        loaded++;
      }
    };

    img.onerror = () => {}; // bỏ qua file không tồn tại
  });
</script>
<!-- ===================================================== -->

</body>
</html>
